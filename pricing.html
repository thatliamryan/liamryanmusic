<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing | LiamRyanMusic</title>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/packages.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <main>

        <section class="pricing-section">

            <p class="pricing-label">PACKAGES</p>

            <h1 class="pricing-title">Sessions & Pricing</h1>

            <p class="pricing-description">
                Save by booking in blocks. All students get a free 15-minute intro call.
            </p>

            <div class="package-list">

                <div class="package template-package">

                    <div class="template-package-name">
                        PACKAGE
                    </div>

                    <div class="template-package-price">
                        PRICE
                    </div>

                </div>

                <div class="package">
                    <div class="package-info">
                        <h2>Single session</h2>
                        <p>60 minutes, one-time</p>
                    </div>

                    <div class="package-price">
                        $60
                    </div>
                </div>

                <div class="package">
                    <div class="package-info">
                        <h2>5-session package</h2>
                        <p>Scheduled per student, save 10%</p>
                    </div>

                    <div class="package-price">
                        $270
                    </div>
                </div>

                <div class="package">
                    <div class="package-info">
                        <h2>10-session package</h2>
                        <p>Scheduled per student, save 15%</p>
                    </div>

                    <div class="package-price">
                        $510
                    </div>
                </div>
            </div>

        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
