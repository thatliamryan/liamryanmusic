<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liam Ryan Music</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header>

            <div class="logo">

                <span class="name">Liam Ryan</span>

                <span class="subtitle">– Music Theory Tutor</span>

            </div>

        </header>

        <main>

            <div class="hero-box">

                <div class="hero-content">

                    <div class="hero-text">

                        <p class="hero-label">
                            PRIVATE TUTORING
                        </p>

                        <h1 class="hero-title">
                            Hi, I'm Liam.
                        </h1>

                        <p class="hero-description">
                            One-on-one music theory lessons for students who want to understand what they hear.
                        </p>

                        <div class="hero-buttons">

                            <button class="book-button">
                                Book me!
                            </button>

                            <button class="lessons-button">
                                See lessons & pricing
                            </button>

                        </div>

                    </div>

                    <img class="hero-photo" src="images/liam.jpeg" alt="Liam Ryan">

                </div>

            </div>

            <hr>

        </main>

    </div>

</body>

</html>
